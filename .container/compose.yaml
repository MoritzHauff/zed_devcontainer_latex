services:
  shell:
    build:
      context: .
    volumes:
      - type: bind
        source: ..
        target: /home/texlive/work/
    entrypoint: ["/usr/bin/bash", "-i"]
    stdin_open: true
    tty: true
  latexmk:
    build:
      context: .
    volumes:
      - type: bind
        source: ..
        target: /home/texlive/work/
    entrypoint: ["latexmk"]
